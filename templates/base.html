<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Data Mahasiswa{% endblock %} | Sistem Mahasiswa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="nav-wrap">
            <a class="brand" href="{{ url_for('index') }}">SIMA<span>hasiswa</span></a>
            <a class="nav-link" href="{{ url_for('index') }}">Daftar Mahasiswa</a>
        </div>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{ message }}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">Sistem Informasi Data Mahasiswa · Proyek Lab Pemrograman</footer>
</body>
</html>
